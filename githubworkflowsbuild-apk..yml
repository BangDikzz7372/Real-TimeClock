name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Salin halaman web
        run: mkdir -p www && cp ../index.html www/index.html

      - name: Buat proyek Android
        run: npx cap add android

      - name: Pasang Pillow (untuk ikon)
        run: python3 -m pip install --break-system-packages pillow

      - name: Tambahkan widget, suara alarm, dan izin
        run: python3 patch_android.py

      - name: Sinkronkan
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JamMercusuar-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
